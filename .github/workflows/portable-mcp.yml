name: Portable Windows MCP

on:
  pull_request:
    paths:
      - "sonicbrief_mcp.py"
      - "backend_startup_timeout.py"
      - "scripts/test_backend_startup_timeout.py"
      - "backend/**"
      - "scripts/package_windows_cpu.py"
      - "scripts/collect_portable_licenses.py"
      - "scripts/audit_portable_release.py"
      - "scripts/check_btbn_static_licenses.py"
      - "scripts/test_check_btbn_static_licenses.py"
      - "scripts/audit_ffmpeg_build_recipe.py"
      - "scripts/test_audit_ffmpeg_build_recipe.py"
      - "scripts/check_portable_gpl_codecs.py"
      - "scripts/test_check_portable_gpl_codecs.py"
      - "third_party/**"
      - "scripts/test_portable_mcp_stdio.py"
      - "THIRD_PARTY_NOTICES.md"
      - "npm/sonicbrief-mcp/**"
      - ".github/workflows/portable-mcp.yml"
  push:
    tags:
      - "mcp-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run launcher tests
        run: npm test --prefix npm/sonicbrief-mcp

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit-test FFmpeg recipe evidence audit
        run: python -m unittest discover -s scripts -p test_audit_ffmpeg_build_recipe.py

      - name: Verify pinned FFmpeg static dependency notices
        run: |
          python -m unittest discover -s scripts -p test_check_btbn_static_licenses.py
          python scripts/check_btbn_static_licenses.py

  windows-cpu:
    needs: launcher-tests
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate release tag matches npm version
        shell: pwsh
        run: |
          $package = Get-Content npm/sonicbrief-mcp/package.json -Raw | ConvertFrom-Json
          $expected = "mcp-v$($package.version)"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag must be $expected to match the npm launcher."
          }

      - name: Install Python runtime/build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install "pyinstaller>=6.14,<7"
          # Keep the portable release on the license-reviewed native wheel.
          python -m pip install "ctranslate2==4.8.2"
          python -m pip check

      - name: Acquire checksum-pinned LGPL FFmpeg shared build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $buildTag = 'autobuild-2026-09-30-13-08'
          $asset = 'ffmpeg-n9.0.2-17-g2a571b6068-win64-lgpl-shared-9.0.zip'
          $sha256 = '7157177b8a6cb2174c1650ba8c71b363f2c78cba5330f88c4c02cf5b2b880646'
          $dest = Join-Path $env:RUNNER_TEMP 'ffmpeg-lgpl'
          New-Item -ItemType Directory -Force $dest | Out-Null
          gh release download $buildTag --repo BtbN/FFmpeg-Builds --pattern $asset --dir $dest
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download approved FFmpeg LGPL build.' }
          $zip = Join-Path $dest $asset
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sha256) {
            throw 'FFmpeg build digest has changed. Packaging refused.'
          }
          Expand-Archive -Path $zip -DestinationPath (Join-Path $dest 'extracted') -Force
          $ffmpeg = Get-ChildItem (Join-Path $dest 'extracted') -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          if (!$ffmpeg) { throw 'Downloaded FFmpeg build is missing ffmpeg.exe.' }
          $dir = $ffmpeg.DirectoryName
          if (!(Test-Path (Join-Path $dir 'ffprobe.exe'))) { throw 'FFprobe missing.' }
          if (!(Get-ChildItem $dir -Filter '*.dll')) { throw 'Expected shared FFmpeg DLLs.' }
          $versionOutput = (& $ffmpeg.FullName -version 2>&1 | Out-String)
          $licenseOutput = (& $ffmpeg.FullName -L 2>&1 | Out-String)
          if ($versionOutput -match '--enable-gpl' -or $licenseOutput -notmatch 'GNU Lesser General Public License') {
            throw 'Unexpected FFmpeg license/build flags. Packaging refused.'
          }
          $license = Join-Path (Split-Path $dir -Parent) 'LICENSE.txt'
          if (!(Test-Path $license)) { throw 'LGPL license text missing.' }
          "FFMPEG_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FFMPEG_LICENSE_FILE=$license" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build source-linked LGPL PyAV wheel (no upstream GPL codecs)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install "setuptools>=77,<85" "cython>=3.1,<4" "wheel>=0.45" "delvewheel>=1.8"
          if ($LASTEXITCODE -ne 0) { throw "PyAV build tool installation failed" }
          $source = Join-Path $env:RUNNER_TEMP 'pyav-upstream'
          git clone --depth 1 --branch v18.1.0 https://github.com/PyAV-Org/PyAV.git $source
          if ($LASTEXITCODE -ne 0) { throw "PyAV source checkout failed" }
          $revision = (git -C $source rev-parse HEAD).Trim()
          if ($revision -ne '7e3d950a8b72062502c1a60d672f8ca565313af5') {
            throw "Unexpected PyAV source revision: $revision"
          }
          $ffmpegRoot = Split-Path $env:FFMPEG_DIR -Parent
          if (!(Test-Path (Join-Path $ffmpegRoot 'include/libavcodec/avcodec.h'))) {
            throw "Pinned LGPL FFmpeg development headers not found"
          }
          Push-Location $source
          try {
            python setup.py bdist_wheel "--ffmpeg-dir=$ffmpegRoot"
            if ($LASTEXITCODE -ne 0) { throw "PyAV source build failed" }
          } finally {
            Pop-Location
          }
          $wheel = Get-ChildItem (Join-Path $source 'dist') -Filter '*.whl' | Select-Object -First 1
          if (!$wheel) { throw "Built PyAV wheel missing" }
          $wheelhouse = Join-Path $env:RUNNER_TEMP 'pyav-lgpl-wheelhouse'
          New-Item -ItemType Directory -Force $wheelhouse | Out-Null
          python -m delvewheel repair --add-path $env:FFMPEG_DIR --wheel-dir $wheelhouse $wheel.FullName
          if ($LASTEXITCODE -ne 0) { throw "PyAV LGPL DLL bundling failed" }
          $repaired = Get-ChildItem $wheelhouse -Filter '*.whl' | Select-Object -First 1
          if (!$repaired) { throw "Repaired PyAV wheel missing" }
          python -m pip install --force-reinstall --no-deps $repaired.FullName
          if ($LASTEXITCODE -ne 0) { throw "Installing LGPL PyAV wheel failed" }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "LGPL PyAV dependency check failed" }
          @'
          import io, wave
          from faster_whisper.audio import decode_audio
          with io.BytesIO() as wav_bytes:
              with wave.open(wav_bytes, "wb") as wav:
                  wav.setnchannels(1)
                  wav.setsampwidth(2)
                  wav.setframerate(16000)
                  wav.writeframes(b"\0\0" * 16000)
              wav_bytes.seek(0)
              audio = decode_audio(wav_bytes, sampling_rate=16000)
          if len(audio) != 16000:
              raise RuntimeError("Source-built LGPL PyAV decode failed")
          print("Source-built LGPL PyAV WAV decode passed.")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Source-built LGPL PyAV smoke test failed" }

      - name: Unit-test LGPL-only codec policy
        run: python -m unittest discover -s scripts -p test_check_portable_gpl_codecs.py

      - name: Unit-test packaged backend startup timeout
        run: python -m unittest discover -s scripts -p test_backend_startup_timeout.py

      - name: Build PyInstaller CPU runtime
        run: python scripts/package_windows_cpu.py

      - name: Reject GPL-associated codecs in LGPL-only portable runtime
        run: python scripts/check_portable_gpl_codecs.py build/portable/SonicBrief-MCP

      - name: Self-test packaged application (no Docker or Python environment at runtime)
        shell: pwsh
        run: |
          $env:SONICBRIEF_FORCE_CPU = '1'
          $env:SONICBRIEF_DATA_DIR = Join-Path $env:RUNNER_TEMP "SonicBriefTestData"
          if (!(Test-Path "build/portable/SonicBrief-MCP/LICENSE")) { throw "MIT LICENSE was not bundled." }
          if (!(Test-Path "build/portable/SonicBrief-MCP/THIRD_PARTY_NOTICES.md")) { throw "Third-party notices were not bundled." }
          if (!(Test-Path "build/portable/SonicBrief-MCP/third_party/ffmpeg/LICENSE.txt")) { throw "FFmpeg LGPL license was not bundled." }
          $inventory = "build/portable/SonicBrief-MCP/third_party/python/INVENTORY.json"
          if (!(Test-Path $inventory)) { throw "Python license inventory missing." }
          $report = Get-Content $inventory -Raw | ConvertFrom-Json
          if (@($report.packages).Count -lt 10 -or @($report.missing_license_files).Count -gt 0) {
            throw "Python license inventory incomplete."
          }
          if (!(Test-Path "build/portable/SonicBrief-MCP/third_party/python_licenses/cpython-3.11.9/LICENSE")) { throw "CPython license missing." }
          & "build/portable/SonicBrief-MCP/SonicBrief-MCP.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "The packaged MCP failed the self-test." }

      - name: Smoke-test npm launcher against bundled runtime
        shell: pwsh
        run: |
          $env:SONICBRIEF_MCP_BINARY = (Resolve-Path "build/portable/SonicBrief-MCP/SonicBrief-MCP.exe").Path
          $env:SONICBRIEF_DATA_DIR = Join-Path $env:RUNNER_TEMP "SonicBriefLauncherData"
          node npm/sonicbrief-mcp/bin/sonicbrief-mcp.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw "The npm launcher could not start the portable MCP." }

      - name: End-to-end MCP handshake via Node launcher
        shell: pwsh
        run: |
          $env:SONICBRIEF_MCP_BINARY = (Resolve-Path "build/portable/SonicBrief-MCP/SonicBrief-MCP.exe").Path
          $env:SONICBRIEF_DATA_DIR = Join-Path $env:RUNNER_TEMP "SonicBriefMcpHandshakeData"
          python scripts/test_portable_mcp_stdio.py
          if ($LASTEXITCODE -ne 0) { throw "Portable MCP stdio integration failed." }

      - name: Create ZIP, SHA-256 and npm package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/release | Out-Null
          $zip = "build/release/sonicbrief-windows-x64-cpu.zip"
          Compress-Archive -Path "build/portable/SonicBrief-MCP/*" -DestinationPath $zip
          $digest = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  sonicbrief-windows-x64-cpu.zip" | Set-Content "build/release/SHA256SUMS.txt" -Encoding ascii
          $manifestPath = "npm/sonicbrief-mcp/runtime-manifest.json"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $manifest.sha256 = $digest
          $encoded = $manifest | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) $manifestPath), $encoded, [System.Text.UTF8Encoding]::new($false))
          Push-Location npm/sonicbrief-mcp
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'npm test failed.' }
          npm pack --pack-destination ../../build/release
          if ($LASTEXITCODE -ne 0) { throw 'npm pack failed.' }
          Pop-Location

      - name: Smoke-test generated npm tarball on Windows
        shell: pwsh
        run: |
          $env:SONICBRIEF_MCP_BINARY = (Resolve-Path "build/portable/SonicBrief-MCP/SonicBrief-MCP.exe").Path
          $env:SONICBRIEF_DATA_DIR = Join-Path $env:RUNNER_TEMP "SonicBriefNpmTarballData"
          $tarball = (Get-ChildItem "build/release" -Filter "*.tgz" | Select-Object -First 1).FullName
          if (!$tarball) { throw 'npm tarball was not produced.' }
          npm exec --yes --package "$tarball" -- sonicbrief-mcp --self-test
          if ($LASTEXITCODE -ne 0) { throw "The packed npm launcher could not start the portable MCP." }

      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: portable-windows-mcp
          path: |
            build/release/*.zip
            build/release/SHA256SUMS.txt
            build/release/*.tgz

      - name: Create tagged draft GitHub Release (publication remains manual)
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" "build/release/sonicbrief-windows-x64-cpu.zip" "build/release/SHA256SUMS.txt" --title "SonicBrief MCP $env:GITHUB_REF_NAME (Windows CPU)" --generate-notes --draft
