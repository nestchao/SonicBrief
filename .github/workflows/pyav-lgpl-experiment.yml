name: Experimental LGPL PyAV wheel (not a release)

on:
  pull_request:
    paths:
      - ".github/workflows/pyav-lgpl-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-pyav-wheel:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Install isolated build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=77,<85" "cython>=3.1,<4" "wheel>=0.45" "delvewheel>=1.8"

      - name: Clone exact upstream PyAV 18.1.0 source
        shell: pwsh
        run: |
          git clone --depth 1 --branch v18.1.0 https://github.com/PyAV-Org/PyAV.git build/pyav-src
          if ($LASTEXITCODE -ne 0) { throw "PyAV clone failed" }
          $commit = (git -C build/pyav-src rev-parse HEAD).Trim()
          if ($commit -ne '7e3d950a8b72062502c1a60d672f8ca565313af5') {
            throw "PyAV upstream source changed unexpectedly: $commit"
          }

      - name: Download and verify LGPL-only FFmpeg 9 shared development files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'autobuild-2026-09-30-13-08'
          $asset = 'ffmpeg-n9.0.2-17-g2a571b6068-win64-lgpl-shared-9.0.zip'
          $digest = '7157177b8a6cb2174c1650ba8c71b363f2c78cba5330f88c4c02cf5b2b880646'
          $dest = Join-Path $env:RUNNER_TEMP 'ffmpeg-lgpl'
          New-Item -ItemType Directory -Force $dest | Out-Null
          gh release download $tag --repo BtbN/FFmpeg-Builds --pattern $asset --dir $dest
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg source download failed' }
          $zip = Join-Path $dest $asset
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $digest) {
            throw 'FFmpeg pinned release SHA256 mismatch'
          }
          Expand-Archive $zip (Join-Path $dest 'src') -Force
          $ffmpeg = Get-ChildItem (Join-Path $dest 'src') -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (!$ffmpeg) { throw 'FFmpeg exe missing' }
          $root = Split-Path $ffmpeg.DirectoryName -Parent
          if (!(Test-Path (Join-Path $root 'include/libavcodec/avcodec.h'))) { throw 'FFmpeg headers missing' }
          if (!(Test-Path (Join-Path $root 'lib/avcodec.lib'))) { throw 'FFmpeg import libs missing' }
          "$root" | Out-File build/ffmpeg-devel-path.txt -Encoding utf8
          Write-Host "Using FFmpeg developer files from $root"

      - name: Build PyAV 18.1.0 against LGPL-shared FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ffmpeg = (Get-Content build/ffmpeg-devel-path.txt -Raw).Trim()
          Push-Location build/pyav-src
          try {
            python setup.py bdist_wheel "--ffmpeg-dir=$ffmpeg"
            if ($LASTEXITCODE -ne 0) { throw 'PyAV build failed' }
          } finally {
            Pop-Location
          }

      - name: Bundle linked LGPL FFmpeg DLLs and inspect wheel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ffmpeg = (Get-Content build/ffmpeg-devel-path.txt -Raw).Trim()
          $wheel = Get-ChildItem build/pyav-src/dist -Filter '*.whl' | Select-Object -First 1
          if (!$wheel) { throw 'PyAV wheel missing' }
          New-Item -ItemType Directory -Force build/pyav-wheelhouse | Out-Null
          python -m delvewheel repair --add-path (Join-Path $ffmpeg 'bin') --wheel-dir build/pyav-wheelhouse $wheel.FullName
          if ($LASTEXITCODE -ne 0) { throw 'delvewheel repair failed' }
          $final = Get-ChildItem build/pyav-wheelhouse -Filter '*.whl' | Select-Object -First 1
          if (!$final) { throw 'Repaired PyAV wheel missing' }
          @'
          import glob, zipfile
          p = glob.glob('build/pyav-wheelhouse/*.whl')[0]
          with zipfile.ZipFile(p) as z:
              names = z.namelist()
          bad = [x for x in names if x.lower().rsplit('/', 1)[-1].startswith(('libx264-', 'libx265-'))]
          print('PYAV_WHEEL', p, 'DLL_TOTAL', len([x for x in names if x.lower().endswith('.dll')]))
          if bad:
              raise SystemExit('GPL-associated wheel DLLs detected: ' + ', '.join(bad))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'GPL codec scan failed' }

      - name: Decode a real WAV using LGPL-linked PyAV and faster-whisper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install "faster-whisper==1.2.0" "requests>=2.32,<3"
          if ($LASTEXITCODE -ne 0) { throw 'Could not install test dependencies' }
          $wheel = Get-ChildItem build/pyav-wheelhouse -Filter '*.whl' | Select-Object -First 1
          python -m pip install --force-reinstall --no-deps $wheel.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Could not install LGPL wheel' }
          @'
          import os, tempfile, wave
          import av
          from faster_whisper.audio import decode_audio
          fd, p = tempfile.mkstemp(suffix='.wav')
          os.close(fd)
          try:
              with wave.open(p, 'wb') as wav:
                  wav.setnchannels(1)
                  wav.setsampwidth(2)
                  wav.setframerate(16000)
                  wav.writeframes(b'\0\0' * 16000)
              audio = decode_audio(p, sampling_rate=16000)
              assert len(audio) == 16000, len(audio)
              print('LGPL_PYAV_DECODE_PASS', av.__version__, len(audio))
          finally:
              os.unlink(p)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'PyAV faster-whisper decode failed' }

      - name: Upload prototype wheel for internal review
        uses: actions/upload-artifact@v4
        with:
          name: experimental-pyav-lgpl-win64
          path: build/pyav-wheelhouse/*.whl
