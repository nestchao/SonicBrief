name: Website

# The marketing site in site/ is plain HTML/CSS/JS, so this job validates it and
# uploads it to GitHub Pages. There is no build step and nothing to install
# beyond Node for the checker.

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/check_site.mjs"
      - "scripts/build_site_assets.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate the site
        run: node scripts/check_site.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
